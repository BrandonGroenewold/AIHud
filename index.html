<html lang="en"><head><meta charset="utf-8">

<style>

.box{border-left:1px solid rgba(var(--rgb),.4);padding-left:12px}.r{border-left:0;border-right:1px solid rgba(var(--rgb),.4);padding:0 12px 0 0;text-align:right}
.dim{color:rgba(var(--rgb),.55)}.big{font-size:28px;font-weight:300;color:#eef8ff;line-height:1.15}.title{font-size:13px;font-weight:600;letter-spacing:.45em;color:#eef8ff}
#tl{top:calc(28px + env(safe-area-inset-top,0px));left:30px}#tr{top:calc(28px + env(safe-area-inset-top,0px));right:30px}

#ctl{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(52px + env(safe-area-inset-bottom,0px));width:min(600px,94vw);display:flex;flex-wrap:wrap;gap:8px;justify-content:center;font:12px "Segoe UI",system-ui,sans-serif;color:rgba(var(--rgb),.9);opacity:0}

</style></head><body>
<canvas id="c" tabindex="0" role="button" aria-label="AI core. Toggle listening"></canvas>
<div class="p" id="tl"><div class="box"><div class="title">CORE</div><div id="st">Standing by</div><div class="dim" id="br">Local model · on-device</div></div></div>
<div class="p" id="tr"><div class="box r"><div class="big" id="clk">--:--</div><div class="dim" id="dt"></div></div></div>
<div id="cores"><button class="on" data-c="bloom">Neural Bloom</button><button data-c="ferro">Ferrofluid</button><button data-c="hole">Black Hole</button><button data-c="orrery">Orrery</button><button data-c="aurora">Aurora</button><button data-c="lattice">Lattice</button><button data-c="reactor">Reactor</button><button data-c="jarvis">Jarvis</button><button data-c="atom">Atom</button></div>
<div id="tx"><div id="you"></div><div id="jv"></div></div>
<div id="ctl"><button data-s="auto" class="on">Auto demo</button><button data-s="idle">Idle</button><button data-s="listening">Listening</button><button data-s="thinking">Thinking</button><button data-s="speaking">Speaking</button><button data-s="claude">Claude</button></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id),cv=$('c'),ctx=cv.getContext('2d');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches,TAU=Math.PI*2;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
let DPR=1,cx=0,cy=0,U=0,state='idle',brain='local';
const mood={breath:1,pull:0,fire:0,speak:0,spin:1,glow:.3,k:0},boot={v:0},S={rot:0};
const P={main:[[90,200,255],[255,176,84]],hot:[[225,248,255],[255,238,205]],deep:[[20,60,170],[150,70,10]],bg:[[6,22,70],[60,30,6]]};
const rgb=p=>[0,1,2].map(i=>lerp(p[0][i],p[1][i],mood.k));
const col=(p,a)=>{const c=rgb(p);return`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`};

/* ---- network: fibonacci-sphere cloud, k-nearest synapses ---- */
const N=360,nodes=[],edges=[],adj=Array.from({length:N},()=>[]);
for(let i=0;i<N;i++){
  const y=1-2*(i+.5)/N,r=Math.sqrt(1-y*y),a=i*2.399963,rad=.55+.45*Math.cbrt(Math.random());
  nodes.push({x:Math.cos(a)*r*rad,y:y*rad*.92,z:Math.sin(a)*r*rad,ph:Math.random()*TAU,sz:.6+Math.random()*1.2,e:0,d:0});
}
const seen=new Set();
nodes.forEach((n,i)=>{
  const ds=nodes.map((m,j)=>[j,(n.x-m.x)**2+(n.y-m.y)**2+(n.z-m.z)**2]).filter(d=>d[0]!==i).sort((a,b)=>a[1]-b[1]).slice(0,4);
  ds.forEach(([j])=>{const k=i<j?i*1000+j:j*1000+i;if(seen.has(k))return;seen.add(k);edges.push([i,j]);adj[i].push(j);adj[j].push(i)});
});
const sig=[];  /* travelling signals along edges */
function fire(i){
  if(nodes[i].d>0)return;nodes[i].e=1;nodes[i].d=.5;
  adj[i].forEach(j=>{if(Math.random()<.55)sig.push({a:i,b:j,t:0,sp:1.6+Math.random()*1.4,gen:0})});
}
const PX=new Float32Array(N),PY=new Float32Array(N),PZ=new Float32Array(N);
let tNext=0;

function project(t){
  const ry=S.rot,cr=Math.cos(ry),sr=Math.sin(ry),tl=.35,ct=Math.cos(tl),st=Math.sin(tl);
  for(let i=0;i<N;i++){
    const n=nodes[i];
    const br=mood.breath*(1+.035*Math.sin(t*.9+n.ph))*(1-.28*mood.pull*(.6+.4*Math.sin(t*5+n.ph)));
    const rip=1+.07*mood.speak*Math.sin(Math.hypot(n.x,n.y,n.z)*9-t*6);
    const k=br*rip,x=n.x*k,y=n.y*k,z=n.z*k;
    const x1=x*cr+z*sr,z1=-x*sr+z*cr,y2=y*ct-z1*st,z2=y*st+z1*ct,pf=1/(1-z2*.35);
    PX[i]=cx+x1*U*pf;PY[i]=cy+y2*U*pf;PZ[i]=z2;
  }
}
function draw(t,dt){
  const a=boot.v,w=cv.width,h=cv.height;
  ctx.fillStyle='#02040c';ctx.fillRect(0,0,w,h);
  let g=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(w,h)*.6);
  g.addColorStop(0,col(P.bg,.7));g.addColorStop(1,col(P.bg,0));ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  /* core glow */
  const gr=U*(.9+.25*mood.glow);g=ctx.createRadialGradient(cx,cy,0,cx,cy,gr);
  g.addColorStop(0,col(P.deep,(.35+.4*mood.glow)*a));g.addColorStop(1,col(P.deep,0));ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,gr,0,TAU);ctx.fill();
  project(t);
  /* cascade engine */
  if(mood.fire>.05){tNext-=dt;if(tNext<=0){tNext=.07/mood.fire;fire((Math.random()*N)|0)}}
  for(const n of nodes){n.e=Math.max(0,n.e-dt*1.3);n.d=Math.max(0,n.d-dt)}
  for(let s=sig.length-1;s>=0;s--){
    const q=sig[s];q.t+=dt*q.sp;
    if(q.t>=1){nodes[q.b].e=1;if(q.gen<4&&mood.fire>.05&&Math.random()<.8){const nb=adj[q.b][(Math.random()*adj[q.b].length)|0];if(nb!==q.a)sig.push({a:q.b,b:nb,t:0,sp:q.sp,gen:q.gen+1})}sig.splice(s,1)}
  }
  /* synapses, batched by depth */
  ctx.lineWidth=DPR*.8;
  for(let b=0;b<3;b++){
    ctx.strokeStyle=col(P.main,(.05+.07*b)*a*(1+mood.glow));ctx.beginPath();
    for(const[i,j]of edges){const z=(PZ[i]+PZ[j])*.5,bi=z<-.25?0:z<.25?1:2;if(bi!==b)continue;ctx.moveTo(PX[i],PY[i]);ctx.lineTo(PX[j],PY[j])}
    ctx.stroke();
  }
  ctx.globalCompositeOperation='lighter';
  /* lit edges from excited nodes */
  ctx.lineWidth=DPR*1.3;
  for(const[i,j]of edges){const e=Math.max(nodes[i].e,nodes[j].e);if(e<.05)continue;ctx.strokeStyle=col(P.hot,e*.5*a);ctx.beginPath();ctx.moveTo(PX[i],PY[i]);ctx.lineTo(PX[j],PY[j]);ctx.stroke()}
  /* signals */
  for(const q of sig){const x=lerp(PX[q.a],PX[q.b],q.t),y=lerp(PY[q.a],PY[q.b],q.t),r=5*DPR;
    const sg=ctx.createRadialGradient(x,y,0,x,y,r);sg.addColorStop(0,col(P.hot,.95*a));sg.addColorStop(1,col(P.main,0));ctx.fillStyle=sg;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill()}
  /* nodes with soft sprites */
  for(let i=0;i<N;i++){
    const n=nodes[i],z=(PZ[i]+1)/2,tw=.6+.4*Math.sin(t*1.7+n.ph),e=n.e;
    const al=(.25+.5*z)*tw*a+e*.7,r=(n.sz*(.7+.6*z)+e*3.2)*DPR;
    if(e>.08||n.sz>1.5){const sg=ctx.createRadialGradient(PX[i],PY[i],0,PX[i],PY[i],r*4);sg.addColorStop(0,col(P.main,Math.min(1,al)*.5));sg.addColorStop(1,col(P.main,0));ctx.fillStyle=sg;ctx.beginPath();ctx.arc(PX[i],PY[i],r*4,0,TAU);ctx.fill()}
    ctx.fillStyle=col(e>.2?P.hot:P.main,Math.min(1,al));ctx.beginPath();ctx.arc(PX[i],PY[i],r,0,TAU);ctx.fill();
  }
  /* inner light */
  const ig=ctx.createRadialGradient(cx,cy,0,cx,cy,U*.22);ig.addColorStop(0,col(P.hot,(.5+.4*mood.glow)*a));ig.addColorStop(1,col(P.main,0));ctx.fillStyle=ig;ctx.beginPath();ctx.arc(cx,cy,U*.22,0,TAU);ctx.fill();
  /* speaking ripples */
  if(mood.speak>.02)for(let i=0;i<3;i++){const p=(t*.4+i/3)%1;ctx.strokeStyle=col(P.main,(1-p)*.4*mood.speak*a);ctx.lineWidth=DPR*(2-p*1.4);ctx.beginPath();ctx.arc(cx,cy,(.25+p*.85)*U,0,TAU);ctx.stroke()}
  ctx.globalCompositeOperation='source-over';
}

/* ---- states ---- */
const PRE={idle:{breath:1,pull:0,fire:0,speak:0,spin:1,glow:.3},listening:{breath:.96,pull:1,fire:0,speak:0,spin:.7,glow:.6},
 thinking:{breath:1.04,pull:0,fire:1,speak:0,spin:2.4,glow:1},speaking:{breath:1,pull:0,fire:.12,speak:1,spin:1.2,glow:.7}};
const LBL={idle:'Standing by',listening:'Listening',thinking:'Thinking',speaking:'Speaking'};
function setState(s,b='local'){
  state=s;brain=b;$('st').textContent=LBL[s];$('br').textContent=b==='claude'?'Escalated to Claude · remote':'Local model · on-device';
  anime.remove(mood);anime(Object.assign({targets:mood,duration:1100,easing:'easeInOutSine'},PRE[s],{k:b==='claude'?1:0}));
  [JV,AT].forEach(m=>{anime.remove(m.mood);anime(Object.assign({targets:m.mood,duration:1100,easing:'easeInOutSine'},m.PRE[s],{k:b==='claude'?1:0}))});
}
const SC=[{you:'Run the tests for the auth module and tell me what fails.',log:[['Reading','auth/, 14 files'],['Running','pytest tests/auth -q'],['Parsing','2 failed, 41 passed']],reply:'Two tests fail in token refresh. Both expect a UTC timestamp, but the helper returns local time. Want me to patch it and rerun?'},
{you:'Summarize what changed in the last three commits.',log:[['Reading','git log -3'],['Diffing','6 files, +212 / -48']],reply:'Mostly a refactor of the ingestion step, plus a new retry wrapper and updated tests. Nothing touches the public API.'},
{you:'Design a caching layer for the ingestion pipeline and weigh the tradeoffs.',claude:1,log:[['Reading','pipeline/, 22 files'],['Local model','low confidence']],clog:[['Calling','Claude, long context'],['Received','plan with 3 options']],reply:'Three options: an in-process LRU, a Redis layer, or content-hash memoization on disk. I would start with memoization, since your jobs are idempotent and batch-shaped.'}];
let auto=!reduce,run=0;
const W=(ms,id)=>new Promise(r=>setTimeout(()=>r(id===run),ms));
async function type(el,tx,ms,id){for(let i=1;i<=tx.length;i++){el.textContent=tx.slice(0,i);if(!(await W(ms,id)))return false}return true}
async function play(sc,id){
  $('you').textContent='';$('jv').textContent='';setState('listening');
  if(!(await W(700,id)))return;if(!(await type($('you'),'\u201C'+sc.you+'\u201D',30,id)))return;if(!(await W(500,id)))return;
  setState('thinking');for(const[x,y]of sc.log){pushLog(x,y);if(!(await W(900,id)))return}
  if(sc.claude){setState('thinking','claude');pushLog('Escalating','handing off to Claude');for(const[x,y]of sc.clog){if(!(await W(1200,id)))return;pushLog(x,y)}if(!(await W(800,id)))return}
  setState('speaking',sc.claude?'claude':'local');if(!(await type($('jv'),sc.reply,22,id)))return;
  if(!(await W(3000,id)))return;setState('idle');await W(3000,id);
}
async function demo(id){let i=0;while(auto&&id===run)await play(SC[i++%SC.length],id)}
const chips=[...document.querySelectorAll('#ctl button')];
function manual(n){auto=false;run++;chips.forEach(b=>b.classList.toggle('on',b.dataset.s===n));$('you').textContent='';$('jv').textContent='';n==='claude'?setState('thinking','claude'):setState(n)}
chips.forEach(b=>b.onclick=()=>{if(b.dataset.s==='auto'){auto=true;run++;chips.forEach(x=>x.classList.toggle('on',x===b));demo(run)}else manual(b.dataset.s)});
cv.onclick=()=>manual(state==='listening'?'idle':'listening');
cv.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();cv.onclick()}};
/* ---- Ferrofluid orb (three.js) ---- */
let core='bloom',F=null;
const VS=`uniform float uT,uSpike,uChurn,uPull;varying vec3 vN,vV;
float h(vec3 p){p=fract(p*.3183099+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float n3(vec3 x){vec3 i=floor(x),f=fract(x);f=f*f*(3.-2.*f);return mix(mix(mix(h(i),h(i+vec3(1,0,0)),f.x),mix(h(i+vec3(0,1,0)),h(i+vec3(1,1,0)),f.x),f.y),mix(mix(h(i+vec3(0,0,1)),h(i+vec3(1,0,1)),f.x),mix(h(i+vec3(0,1,1)),h(i+vec3(1,1,1)),f.x),f.y),f.z);}
float disp(vec3 d){
 float a=uChurn*sin(uT*.8)*1.3*d.y;vec3 q=vec3(d.x*cos(a)+d.z*sin(a),d.y,-d.x*sin(a)+d.z*cos(a));
 float w=(n3(q*1.7+uT*.3)-.5)*(.10+.2*uChurn);
 float s=smoothstep(.5,.95,n3(q*6.+vec3(0.,uT*.4,0.)));s=pow(s,1.6)*(1.+.5*sin(uT*10.+q.y*7.));
 return 1.+w-.1*uPull+uSpike*s*.75;}
void main(){
 vec3 d=normalize(position),a=normalize(cross(d,abs(d.y)<.99?vec3(0,1,0):vec3(1,0,0))),b=cross(d,a);float e=.012;
 vec3 d1=normalize(d+a*e),d2=normalize(d+b*e);
 vec3 p0=d*disp(d),p1=d1*disp(d1),p2=d2*disp(d2);
 vec3 n=normalize(cross(p1-p0,p2-p0));if(dot(n,d)<0.)n=-n;
 vN=normalize(normalMatrix*n);vec4 mv=modelViewMatrix*vec4(p0,1.);vV=-mv.xyz;gl_Position=projectionMatrix*mv;}`;
const FS=`uniform float uK;varying vec3 vN,vV;
void main(){
 vec3 N=normalize(vN),V=normalize(vV),R=reflect(-V,N);
 vec3 tint=mix(vec3(.35,.8,1.),vec3(1.,.69,.33),uK);
 float hor=smoothstep(-.6,.9,R.y);
 vec3 env=vec3(.01,.015,.03)+tint*.2*pow(hor,3.);
 env+=vec3(1.,.97,.95)*pow(max(dot(R,normalize(vec3(-.5,.8,.6))),0.),60.)*2.6;
 env+=tint*pow(max(dot(R,normalize(vec3(.8,.2,.5))),0.),22.)*1.4;
 env+=tint*pow(max(dot(R,normalize(vec3(0.,-.7,.5))),0.),12.)*.5;
 float fr=pow(1.-max(dot(N,V),0.),3.);
 vec3 c=env*(.5+.6*fr)+tint*fr*.85;
 c=c/(1.+c);gl_FragColor=vec4(pow(c,vec3(.85)),1.);}`;
const fc=document.createElement('canvas');fc.setAttribute('aria-label','Ferrofluid core');
fc.style.cssText='position:fixed;inset:0;width:100%;height:100%;display:none;cursor:pointer;background:radial-gradient(circle at 50% 48%,rgba(var(--rgb),.16),transparent 42%)';
cv.after(fc);fc.onclick=()=>cv.onclick();
function initFerro(){
  if(F||!window.THREE)return;
  const r=new THREE.WebGLRenderer({canvas:fc,alpha:true,antialias:true});
  const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(32,1,.1,50);
  const u={uT:{value:0},uSpike:{value:0},uChurn:{value:0},uPull:{value:0},uK:{value:0}};
  const m=new THREE.Mesh(new THREE.SphereGeometry(1,170,170),new THREE.ShaderMaterial({uniforms:u,vertexShader:VS,fragmentShader:FS}));
  m.rotation.x=.3;sc.add(m);F={r,sc,cam,u,m};fResize();
}
function fResize(){
  if(!F)return;const w=innerWidth,h=innerHeight;F.r.setPixelRatio(DPR);F.r.setSize(w,h,false);
  F.cam.aspect=w/h;F.cam.position.z=5.4/Math.min(1,w/h*1.25);F.cam.updateProjectionMatrix();
}
function ferroDraw(t,dt){
  if(!F)return;const u=F.u,env=Math.abs(Math.sin(t*7.4)*Math.sin(t*2.6+.5)),mic=Math.abs(Math.sin(t*6.3))*.6+Math.abs(Math.sin(t*2.1+1))*.4;
  u.uT.value=t;u.uSpike.value=Math.max(mood.speak*(.35+.65*env),mood.pull*.3*mic,mood.fire*.08);
  u.uChurn.value=mood.fire;u.uPull.value=mood.pull;u.uK.value=mood.k;
  F.m.rotation.y+=dt*(.22+.7*mood.fire);F.m.scale.setScalar(.6+.4*boot.v);F.r.render(F.sc,F.cam);
}
/* ---- Black hole accretion (canvas 2D) ---- */
const HN=9000,hrn=new Float32Array(HN),hth=new Float32Array(HN),hy=new Float32Array(HN),hsp=new Float32Array(HN);
const RIN=1.15,ROUT=4.3;
function hSpawn(i,any){hrn[i]=any?RIN+(ROUT-RIN)*Math.pow(Math.random(),1.5):ROUT*(.92+.08*Math.random());hth[i]=Math.random()*TAU;hy[i]=(Math.random()+Math.random()+Math.random()-1.5)*.07*hrn[i];hsp[i]=.85+.3*Math.random()}
for(let i=0;i<HN;i++)hSpawn(i,true);
const HB=[0,1,2].map(()=>Array.from({length:15},()=>[]));
function hCol(cb,a){const t=cb/4,h=rgb(P.hot),m=rgb(P.main),d=rgb(P.deep);
  const c=t<.5?h.map((v,i)=>lerp(v,m[i],t*2)):m.map((v,i)=>lerp(v,d[i],(t-.5)*2));return`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`}
function hFlush(L,sz,gl,mul){
  for(let b=0;b<15;b++){const A=L[b];if(!A.length)continue;
    ctx.fillStyle=hCol((b/3)|0,Math.min(1,[.3,.55,.95][b%3]*gl*mul));
    for(let k=0;k<A.length;k+=2)ctx.fillRect(A[k],A[k+1],sz,sz);A.length=0}
}
function holeDraw(t,dt){
  const a=boot.v,w=cv.width,h=cv.height,Rs=.25*U*(.7+.3*a);
  ctx.fillStyle='#02040c';ctx.fillRect(0,0,w,h);
  let g=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(w,h)*.55);g.addColorStop(0,col(P.bg,.6));g.addColorStop(1,col(P.bg,0));ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  const gl=(.8+.5*mood.fire+.3*mood.glow)*a,e=.2+.55*mood.pull+.04*Math.sin(t*.3),se=Math.sin(e),ce=Math.cos(e),inflow=.03+.35*mood.fire+.05*mood.speak;
  g=ctx.createRadialGradient(cx,cy,Rs,cx,cy,Rs*4.5);g.addColorStop(0,col(P.main,.28*gl));g.addColorStop(1,col(P.main,0));ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,Rs*4.5,0,TAU);ctx.fill();
  const [LB,BB,FB]=HB;
  for(let i=0;i<HN;i++){
    let rn=hrn[i];rn-=dt*inflow*(rn>2?.5:.25)*hsp[i];
    if(rn<RIN){hSpawn(i,false);rn=hrn[i]}else hrn[i]=rn;
    const th=hth[i]+=dt*1.5*Math.pow(rn,-1.5)*hsp[i]*mood.spin*2;
    const c=Math.cos(th),s=Math.sin(th),R=rn*Rs,tn=(rn-RIN)/(ROUT-RIN),cb=Math.min(4,(tn*5)|0);

    frameEnv = Math.abs(Math.sin(t * 7.4) * Math.sin(t * 2.6 + .5)) * (.7 + .3 * Math.random());
    drawBackground();
    drawHex(t, boot.seg);
    drawSegments(t, boot.seg);
    drawShell(t, boot.shell);
    drawRipples(t);

  }

    const PRE = {
    idle:      { energy: .15, amp: 1,   pull: 1,   spin: 1,   scan: 0, speak: 0, listen: 0, think: 0 },
    listening: { energy: .8,  amp: 1.8, pull: 1,   spin: 1,   scan: 0, speak: 0, listen: 1, think: 0 },
    thinking:  { energy: .5,  amp: .7,  pull: .93, spin: 4,   scan: 1, speak: 0, listen: 0, think: 1 },
    speaking:  { energy: .7,  amp: 1.5, pull: 1,   spin: 1.5, scan: 0, speak: 1, listen: 0, think: 0 }
  };
function resize(){cx=cv.width/2;cy=cv.height*.455;U=Math.min(innerWidth*.28,innerHeight*.275)*DPR}
function enter(){boot.sphere=boot.seg=boot.shell=boot.hud=0;anime({targets:boot,sphere:1,duration:1200,easing:'easeOutCubic'});anime({targets:boot,seg:1,duration:1500,delay:400,easing:'easeOutCubic'});anime({targets:boot,shell:1,duration:2000,delay:700,easing:'easeOutExpo'});anime({targets:boot,hud:1,duration:1500,delay:1200,easing:'easeOutCubic'})}
buildShell();
return{mood,PRE,resize,enter,draw(t,dt){S.rotY=(S.rotY+dt*12*mood.spin)%360;S.segRot=(S.segRot-dt*360/140)%360;S.hexRot=(S.hexRot+dt*2)%360;S.phase=(S.phase+dt*TAU/16)%TAU;draw(t,dt)}};
})();
const AT=(function(){
let cx=0,cy=0,U=0;
/* ---------- animated state (anime.js) ---------- */
  const S    = { phase: 0, rot: 0, nuc: 0 };
  const RV   = { v: 1 };                                       // ring dots visibility (toggle)
  const mood = { energy: .15, amp: 1, pull: 1, spin: 1, think: 0, speak: 0, listen: 0, k: 0 };
  const boot = { ring: 0, orbits: 0, nucleus: 0 };
  let state = 'idle', brain = 'local', frameMic = 0, frameEnv = 0;

  /* ---------- palette: blue <-> amber (k: 0 local, 1 Claude) ---------- */
  const P = {
    main:   [[60,150,255],[255,176,84]],
    light:  [[195,226,255],[255,238,210]],
    core:   [[130,196,255],[255,205,130]],
    elHi:   [[232,247,255],[255,248,230]],
    elMid:  [[70,160,255],[255,190,90]],
    elEdge: [[14,80,235],[215,112,24]],
    prL:    [[255,150,128],[255,178,96]],
    prD:    [[160,6,14],[186,66,6]],
    nuL:    [[140,178,255],[255,224,132]],
    nuD:    [[6,30,160],[160,104,8]],
    halo:   [[30,70,200],[150,84,14]],
    bg:     [[4,18,60],[56,30,6]],
    line:   [[70,160,255],[255,180,90]]
  };
  const rgb = p => [lerp(p[0][0], p[1][0], mood.k), lerp(p[0][1], p[1][1], mood.k), lerp(p[0][2], p[1][2], mood.k)];
  const col = (p, a) => { const c = rgb(p); return `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`; };

  /* ---------- shaded sphere helper ---------- */
  function ball(x, y, r, hi, mid, edge, f, al) {
    const c = a => `rgb(${a[0] * f | 0},${a[1] * f | 0},${a[2] * f | 0})`;
    const g = ctx.createRadialGradient(x - r * .38, y - r * .42, r * .06, x, y, r * 1.05);
    g.addColorStop(0, c(hi)); g.addColorStop(.55, c(mid)); g.addColorStop(1, c(edge));
    ctx.globalAlpha = al; ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    const s = ctx.createRadialGradient(x - r * .4, y - r * .45, 0, x - r * .4, y - r * .45, r * .42);
    s.addColorStop(0, `rgba(255,255,255,${.6 * f})`); s.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = s; ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fill();
    ctx.globalAlpha = 1;
  }
  const mix = (l, d, t) => [lerp(l[0], d[0], t), lerp(l[1], d[1], t), lerp(l[2], d[2], t)];

  /* ---------- nucleus: packed red and blue spheres ---------- */
  const RS = .074, RC = .23, LIM = RC - RS, NUC = [];
  (function () {
    const N = 15, pts = [];
    for (let i = 0; i < N; i++) {
      let x, y, z;
      do { x = Math.random() * 2 - 1; y = Math.random() * 2 - 1; z = Math.random() * 2 - 1; } while (x * x + y * y + z * z > 1);
      pts.push([x * LIM, y * LIM, z * LIM]);
    }
    for (let it = 0; it < 400; it++) {
      for (let a = 0; a < N; a++) for (let b = a + 1; b < N; b++) {
        const dx = pts[a][0] - pts[b][0], dy = pts[a][1] - pts[b][1], dz = pts[a][2] - pts[b][2];
        const d = Math.hypot(dx, dy, dz), m = RS * 2 * .98;
        if (d < m && d > 1e-6) {
          const k = (m - d) / 2 / d;
          pts[a][0] += dx * k; pts[a][1] += dy * k; pts[a][2] += dz * k;
          pts[b][0] -= dx * k; pts[b][1] -= dy * k; pts[b][2] -= dz * k;
        }
      }
      for (const p of pts) {
        const l = Math.hypot(p[0], p[1], p[2]);
        if (l > LIM) { p[0] *= LIM / l; p[1] *= LIM / l; p[2] *= LIM / l; }
        p[0] *= .996; p[1] *= .996; p[2] *= .996;
      }
    }
    pts.forEach((p, i) => NUC.push({ p, type: i % 2 }));
  })();

  function drawNucleus(t, a) {
    if (a <= .002) return;
    const al = Math.min(1, a);
    const sc = .55 + .45 * a;

    const hr = .6 * U * sc;
    const h = ctx.createRadialGradient(cx, cy, 0, cx, cy, hr);
    h.addColorStop(0, col(P.halo, (.38 + .25 * mood.energy) * al)); h.addColorStop(1, col(P.halo, 0));
    ctx.fillStyle = h; ctx.beginPath(); ctx.arc(cx, cy, hr, 0, TAU); ctx.fill();

    const ry = S.nuc * Math.PI / 180, cr = Math.cos(ry), sr = Math.sin(ry);
    const tl = .55, ct = Math.cos(tl), st = Math.sin(tl);
    const items = [];
    for (let i = 0; i < NUC.length; i++) {
      const n = NUC[i]; let x = n.p[0], y = n.p[1], z = n.p[2];
      const x1 = x * cr + z * sr, z1 = -x * sr + z * cr;
      items.push({ x: x1, y: y * ct - z1 * st, z: y * st + z1 * ct, t: n.type });
    }
    items.sort((p, q) => p.z - q.z);
    for (const it of items) {
      const k = 1 + it.z * 1.6;
      const px = cx + it.x * U * sc * k, py = cy + it.y * U * sc * k, r = RS * U * sc * k;
      const f = .68 + .32 * ((it.z / LIM) + 1) / 2;
      const L = P.nuL, D = P.nuD;
      ball(px, py, r, rgb(L), mix(rgb(L), rgb(D), .55), rgb(D), f, al);
    }
  }

  /* ---------- orbits + electrons ---------- */
  const ORB = [
    { base: 90,  speed: 1.0,  dir:  1, ph: 0 },
    { base: 30,  speed: .86,  dir: -1, ph: 1.1 },
    { base: -30, speed: .93,  dir:  1, ph: 2.3 }
  ];
  const EL = ORB.map(o => [o.ph, o.ph + Math.PI]);
  const A0 = .88, B0 = .37;
  const GEOM = [{}, {}, {}];
  let EP = [];

  function geom(i, t) {
    const o = ORB[i], grow = .8 + .2 * boot.orbits;
    const phi = (o.base + S.rot) * Math.PI / 180 + .06 * Math.sin(t * .31 + i * 2.1);
    const A = A0 * grow * (1 + .015 * Math.sin(t * .4 + i));
    const B = B0 * grow * (1 + .13 * Math.sin(t * .5 + i * 1.7)) * (1 + .05 * mood.energy);
    return { A, B, c: Math.cos(phi), s: Math.sin(phi) };
  }
  function pt(g, u, off) {
    let x = g.A * Math.cos(u), y = g.B * Math.sin(u);
    if (off) {
      const nx = g.B * Math.cos(u), ny = g.A * Math.sin(u), l = Math.hypot(nx, ny) || 1;
      x += nx / l * off; y += ny / l * off;
    }
    return [x * g.c - y * g.s, x * g.s + y * g.c];
  }
  function strokeArc(g, u0, u1) {
    const N = 48; ctx.beginPath();
    for (let k = 0; k <= N; k++) {
      const [X, Y] = pt(g, u0 + (u1 - u0) * k / N);
      k ? ctx.lineTo(cx + X * U, cy + Y * U) : ctx.moveTo(cx + X * U, cy + Y * U);
    }
    ctx.stroke();
  }
  function drawOrbitHalf(g, front, a) {
    if (a <= .002) return;
    const u0 = front ? 0 : Math.PI, u1 = u0 + Math.PI, f = front ? 1 : .5;
    ctx.lineCap = 'round';
    ctx.strokeStyle = col(P.main, .13 * a * f); ctx.lineWidth = 7 * DPR; strokeArc(g, u0, u1);
    ctx.strokeStyle = col(P.main, (.45 + .15 * mood.think) * a * f); ctx.lineWidth = 2.4 * DPR; strokeArc(g, u0, u1);
    ctx.strokeStyle = col(P.light, .85 * a * f); ctx.lineWidth = DPR; strokeArc(g, u0, u1);
  }
  function electrons() {
    const out = [];
    for (let i = 0; i < 3; i++) for (let e = 0; e < 2; e++) {
      const u = EL[i][e], [X, Y] = pt(GEOM[i], u);
      out.push({ i, e, X, Y, z: Math.sin(u), x: cx + X * U, y: cy + Y * U });

  }

  }

  /* ---------- dust along the orbits (the dots, with comet tails) ---------- */
  let DENS = 4, dust = [], totalDots = 0;
  function buildDust() {
    const n = Math.round(160 * DENS);
    dust = ORB.map(() => {
      const u = new Float32Array(n), sp = new Float32Array(n), off = new Float32Array(n);
      for (let i = 0; i < n; i++) {
        u[i] = Math.random() * TAU;
        sp[i] = (Math.random() - .5) * .16;
        off[i] = (Math.random() + Math.random() + Math.random() - 1.5) / 1.5 * (.016 + (Math.random() < .12 ? .03 : 0));

  }
  const DB = [[], [], [], []];

  function drawDust(a) {
    if (a <= .002) return;
    for (let b = 0; b < 4; b++) DB[b].length = 0;
    const tail = .55 * (1 + .8 * mood.think);
    for (let i = 0; i < 3; i++) {
      const D = dust[i], g = GEOM[i], dir = ORB[i].dir, e0 = EL[i][0], e1 = EL[i][1];
      for (let j = 0; j < D.n; j++) {
        const u = D.u[j];

        const d = Math.min(d0, d1);

    }

  }

  /* ---------- outer dot ring (from the first design), tugged by the electrons ---------- */
  const BINS = 720;
  const LAYERS = [
    { R: 1.02,  base: 1100, spread: .010, size: 1.0, alpha: .55, line: .16,
      harm: [[2,.022,.3,1],[3,.016,1.9,-1],[5,.011,4.1,2],[8,.006,2.2,-3]] },

    { R: 1.135, base: 2000, spread: .020, size: 1.2, alpha: .50, line: .28,

        for (let i = 0; i < per; i++) {
          const th = Math.random() * TAU;
          const g = Math.random() + Math.random() + Math.random() - 1.5;

      }

    totalDots += dust.reduce((s, d) => s + d.n, 0);
    
  }

  function drawRing(a) {
    if (a <= .002) return;
    const sc = (.86 + .14 * a) * mood.pull;
    const ampNow = mood.amp * (1 + .35 * mood.listen * frameMic);
    // electron tugs: only strong when an electron is near the tip of its orbit
    const tugs = EP.map(p => {
      const r = Math.hypot(p.X, p.Y);
      return { th: Math.atan2(p.X, -p.Y), s: Math.pow(clamp((r / A0 - .72) / .28, 0, 1), 2) * .05 };
    });

      for (let j = 0; j < BINS; j++) {
        const th = j / BINS * TAU; let sum = 0;
        for (const h of L.harm) sum += h[1] * Math.sin(h[0] * th + h[2] + h[3] * S.phase);
        sum *= ampNow;
        for (const g of tugs) {
          if (g.s < .001) continue;
          let d = Math.abs(th - g.th); d = Math.min(d, TAU - d);
          sum += g.s * Math.exp(-d * d / .035);
        }
        L.wob[j] = sum;
      }
      ctx.strokeStyle = col(P.line, L.line * a); ctx.lineWidth = DPR * 1.2;
      ctx.beginPath();
      for (let j = 0; j <= BINS; j += 4) {
        const jj = j % BINS, th = jj / BINS * TAU, r = (L.R + L.wob[jj]) * U * sc;
        const x = cx + Math.sin(th) * r, y = cy - Math.cos(th) * r;
        j ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.closePath(); ctx.stroke();

      ctx.globalCompositeOperation = 'lighter';
      const s = DPR * L.size, wob = L.wob, R = L.R;
      for (let b = 0; b < 3; b++) {
        const B = L.bk[b];
        ctx.fillStyle = col(P.main, [.38, .68, 1][b] * L.alpha * a);
        for (let i = 0; i < B.n; i++) {
          const r = (R + wob[B.bin[i]] + B.off[i]) * U * sc;
          ctx.fillRect(cx + B.sx[i] * r, cy - B.co[i] * r, s, s);
        }
      }
      ctx.globalCompositeOperation = 'source-over';
    }
  }

  function drawRipples(t) {
    if (mood.speak < .02) return;
    for (let i = 0; i < 3; i++) {
      const p = (t * .45 + i / 3) % 1, r = (.22 + p * .75) * U;
      ctx.strokeStyle = col(P.main, (1 - p) * .45 * mood.speak * boot.nucleus);
      ctx.lineWidth = DPR * (2.2 - p * 1.6);
      ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.stroke();
    }
  }

  /* ---------- frame ---------- */
  function drawBackground() {
    const w = cv.width, h = cv.height;
    ctx.fillStyle = '#01030a'; ctx.fillRect(0, 0, w, h);
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(w, h) * .55);
    g.addColorStop(0, col(P.bg, .55)); g.addColorStop(1, col(P.bg, 0));

    S.nuc += dt * 38 * mood.think;          // nucleus only turns while thinking

    for (const D of dust) for (let j = 0; j < D.n; j++) D.u[j] += D.sp[j] * dt;
  }
  function draw(t) {
    frameMic = clamp((Math.abs(Math.sin(t * 6.3)) * .6 + Math.abs(Math.sin(t * 2.1 + 1)) * .4) * (.6 + .4 * Math.random()), 0, 1);
    frameEnv = Math.abs(Math.sin(t * 7.4) * Math.sin(t * 2.6 + .5)) * (.7 + .3 * Math.random());
    for (let i = 0; i < 3; i++) GEOM[i] = geom(i, t);
    EP = electrons();
    drawBackground();
    drawRing(boot.ring * RV.v);
    drawDust(boot.orbits);
    for (let i = 0; i < 3; i++) drawOrbitHalf(GEOM[i], false, boot.orbits);
    for (const p of EP) if (p.z < 0) drawElectron(p, boot.orbits);
    drawRipples(t);
    drawNucleus(t, boot.nucleus);
    for (let i = 0; i < 3; i++) drawOrbitHalf(GEOM[i], true, boot.orbits);
    for (const p of EP) if (p.z >= 0) drawElectron(p, boot.orbits);
  }

    const PRE = {
    idle:      { energy: .15, amp: 1,   pull: 1,   spin: 1,   think: 0, speak: 0, listen: 0 },
    listening: { energy: .6,  amp: 1.4, pull: 1,   spin: 1,   think: 0, speak: 0, listen: 1 },
    thinking:  { energy: .5,  amp: .7,  pull: .95, spin: 3.2, think: 1, speak: 0, listen: 0 },
    speaking:  { energy: .7,  amp: 1.25, pull: 1,  spin: 1.4, think: 0, speak: 1, listen: 0 }
  };
function resize(){cx=cv.width/2;cy=cv.height*.46;U=Math.min(innerWidth*.36,innerHeight*.29)*DPR}
function enter(){boot.ring=boot.orbits=boot.nucleus=0;anime({targets:boot,nucleus:1,duration:1200,easing:'easeOutBack'});anime({targets:boot,orbits:1,duration:1500,delay:300,easing:'easeOutCubic'});anime({targets:boot,ring:1,duration:2200,delay:800,easing:'easeOutExpo'})}
buildRing();
return{mood,PRE,resize,enter,draw(t,dt){step(dt);S.phase=(S.phase+dt*TAU/16)%TAU;draw(t)}};
})();

function setCore(n){
  core=n;if(n==='ferro')initFerro();if(n==='jarvis')JV.enter();if(n==='atom')AT.enter();
  cv.style.visibility=n==='ferro'?'hidden':'visible';fc.style.display=n==='ferro'?'block':'none';
  document.querySelectorAll('#cores button').forEach(b=>b.classList.toggle('on',b.dataset.c===n));
}
document.querySelectorAll('#cores button').forEach(b=>b.onclick=()=>setCore(b.dataset.c));

function resize(){DPR=Math.min(devicePixelRatio||1,2);cv.width=Math.round(innerWidth*DPR);cv.height=Math.round(innerHeight*DPR);cx=cv.width/2;cy=cv.height*.46;U=Math.min(innerWidth*.34,innerHeight*.3)*DPR;fResize();JV.resize();AT.resize();tkResize();if(reduce)draw(0,0)}
addEventListener('resize',resize);resize();
let lastK=-1,lastD=0;
function dom(now){
  if(Math.abs(mood.k-lastK)>.003){lastK=mood.k;const c=rgb(P.main);document.documentElement.style.setProperty('--rgb',`${c[0]|0},${c[1]|0},${c[2]|0}`)}
  if(now-lastD<250)return;lastD=now;const d=new Date();
  $('clk').textContent=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false});
  $('dt').textContent=d.toLocaleDateString([],{weekday:'long',month:'short',day:'numeric'});
}
if(reduce){boot.v=1;document.querySelectorAll('.p,#ctl,#cores').forEach(e=>e.style.opacity=1);dom(1e6);draw(0,0);return}
anime({targets:boot,v:1,duration:2200,easing:'easeOutExpo'});
anime({targets:['#tl','#tr','#cores','#ctl'],opacity:[0,1],duration:1100,delay:anime.stagger(120,{start:1200}),easing:'easeOutCubic'});
let last=performance.now();
(function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;S.rot+=dt*.18*mood.spin;tickDraw(dt);dom(now);core==='ferro'?ferroDraw(now/1000,dt):core==='hole'?holeDraw(now/1000,dt):core==='orrery'?orreryDraw(now/1000,dt):core==='aurora'?auroraDraw(now/1000,dt):core==='lattice'?latticeDraw(now/1000,dt):core==='reactor'?reactorDraw(now/1000,dt):core==='jarvis'?JV.draw(now/1000,dt):core==='atom'?AT.draw(now/1000,dt):draw(now/1000,dt);requestAnimationFrame(frame)})(last);
setTimeout(()=>demo(run),2400);
})();
